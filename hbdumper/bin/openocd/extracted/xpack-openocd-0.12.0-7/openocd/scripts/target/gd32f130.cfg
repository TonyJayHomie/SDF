# GD32F130 target configuration for OpenOCD
#
# The GD32F130 family is compatible with the STM32F1 flash driver
# (same flash controller IP). This wrapper simply forwards to the
# stock stm32f1x target with tighter defaults for the 20 KiB SRAM
# and 64 KiB flash variant used on the split hoverboard mainboard
# (GD32F130C8T6).

source [find target/stm32f1x.cfg]

# Override flash size if needed
# stm32f1x_options 0x08000000 64
