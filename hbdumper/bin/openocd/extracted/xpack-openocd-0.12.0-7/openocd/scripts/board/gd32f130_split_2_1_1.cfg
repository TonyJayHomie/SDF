# Board: GD32F130 split hoverboard mainboard 2.1.1 (RoboDurden Gen2.x layout 2.0)
#
# Tested target: GD32F130C8T6, 64 KiB flash, 20 KiB SRAM.
# Uses the stock STM32F1x flash driver - the GD32 flash controller is
# command-compatible.
#
# Recommended adapter speed for ST-Link V2 clones with this board: 1000 kHz.
# Bump down to 480 kHz if you see "transport error 0x..." in the log.

source [find interface/stlink.cfg]
transport select hla_swd
set CHIPNAME gd32f130
set CPUTAPID 0x1ba01477
source [find target/stm32f1x.cfg]

# Optional: tighten SRAM bounds for the C8T6 variant
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x5000 -work-area-backup 0

reset_config srst_only srst_nogate
adapter speed 1000
